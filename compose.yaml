
services:
  postgres:
    image: postgres:18
    container_name: transfer-service-postgres
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfer_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer_app -d transfers"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka-controller-1:
    image: apache/kafka:4.1.2
    hostname: kafka-controller-1
    environment: &controller-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-controller-1-data:/var/lib/kafka/data

  kafka-controller-2:
    image: apache/kafka:4.1.2
    hostname: kafka-controller-2
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes:
      - kafka-controller-2-data:/var/lib/kafka/data

  kafka-controller-3:
    image: apache/kafka:4.1.2
    hostname: kafka-controller-3
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes:
      - kafka-controller-3-data:/var/lib/kafka/data

  kafka-broker-1:
    image: apache/kafka:4.1.2
    hostname: kafka-broker-1
    ports:
      - "29092:9092"
    environment: &broker-env
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-2:
    image: apache/kafka:4.1.2
    hostname: kafka-broker-2
    ports:
      - "39092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:19092,PLAINTEXT_HOST://localhost:39092
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-3:
    image: apache/kafka:4.1.2
    hostname: kafka-broker-3
    ports:
      - "49092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:19092,PLAINTEXT_HOST://localhost:49092
    volumes:
      - kafka-broker-3-data:/var/lib/kafka/data
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3
volumes:
  postgres_data:
  kafka-controller-1-data:
  kafka-controller-2-data:
  kafka-controller-3-data:
  kafka-broker-1-data:
  kafka-broker-2-data:
  kafka-broker-3-data:
